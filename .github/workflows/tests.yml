name: Tests
on: [push]
jobs:
  test-es8:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
        plone: ["6.2-latest"]

    services:
      redis:
        image: redis:7.0.5
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      elasticsearch:
        image: elasticsearch:8.17.0
        env:
          discovery.type: single-node
          cluster.name: docker-cluster
          xpack.security.enabled: "false"
          xpack.security.enrollment.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 30s
          --health-retries 30
        ports:
          - 9200:9200
          - 9300:9300

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Plone and package
        run: |
          pip install -U pip wheel
          pip install Plone -c https://dist.plone.org/release/${{ matrix.plone }}/constraints.txt
          pip install "elasticsearch>=8.0.0,<9.0.0"
          pip install -e ".[test, redis]"

      - name: Run tests
        run: |
          zope-testrunner --auto-color --auto-progress --test-path src
